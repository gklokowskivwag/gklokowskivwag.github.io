    ["G", "Nummer 1 sind die Walzen. Drin stecken drei, ausgesucht aus einem Satz von fünf. Jede Walze ist intern fest verdrahtet: 26 Kontakte links, 26 rechts, und jede Walze verbindet die anders."],

  { slide: 7, title: "3.1 Enigma: Weg des Stroms", lines: [

  { slide: 11, title: "4.1 Enigma: Schwächen der Konstruktion", lines: [

const names = { G: "Geronimo", A: "Angelo" };
const colors = { G: "var(--geronimo)", A: "var(--angelo)" };
const el = (id) => document.getElementById(id);

function load(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

const steps = cards.flatMap((card, cardIndex) =>
  card.lines.map((line, lineIndex) => ({ card, cardIndex, line, lineIndex }))
);
let index = Math.min(Math.max(load("step", 0), 0), steps.length - 1);
let size = load("textSize", window.innerWidth <= 600 ? 28 : 40);

function paragraph([who, raw]) {
  const p = document.createElement("p");
  p.className = "line";
  p.style.setProperty("--who", colors[who]);
  const name = document.createElement("span");
  name.className = "who";
  name.textContent = names[who];
  p.append(name);
  p.append(raw);
  return p;
}

function render() {
  const { card, line, lineIndex } = steps[index];
  const who = line[0];
  document.documentElement.style.setProperty("--accent", colors[who]);
  el("card").style.setProperty("--accent", colors[who]);
  el("speaker").textContent = names[who];
  el("position").textContent = `Folie ${card.slide} von ${cards.length}, Teil ${lineIndex + 1} von ${card.lines.length}`;
  el("title").textContent = card.title;
  el("text").replaceChildren(paragraph(line));
  el("text").scrollTop = 0;

  const following = steps[index + 1];
  if (!following) {
    el("next").textContent = "Ende";
  } else if (following.card === card) {
    el("next").textContent = `Als Nächstes: ${names[following.line[0]]}`;
  } else {
    el("next").textContent = `Als Nächstes: Folie ${following.card.slide} weiterklicken, ${following.card.title} (${names[following.line[0]]})`;
  }

  el("prev").disabled = index === 0;
  el("nextBtn").disabled = index === steps.length - 1;
  save("step", index);
}

function go(step) {
  const target = index + step;
  if (target < 0 || target >= steps.length) return;
  index = target;
  render();
}

function setSize(value) {
  size = Math.min(Math.max(value, 16), 80);
  document.body.style.setProperty("--size", size + "px");
  save("textSize", size);
}

document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  switch (event.key) {
    case "Enter": case " ": case "ArrowRight": case "PageDown":
      event.preventDefault(); go(1); break;
    case "ArrowLeft": case "Backspace": case "PageUp":
      event.preventDefault(); go(-1); break;
    case "+": case "=":
      setSize(size + 2); break;
    case "-":
      setSize(size - 2); break;
  }
});

function onClick(id, action) {
  el(id).addEventListener("click", (event) => { action(); event.currentTarget.blur(); });
}
onClick("prev", () => go(-1));
onClick("nextBtn", () => go(1));
onClick("bigger", () => setSize(size + 2));
onClick("smaller", () => setSize(size - 2));

setSize(size);
render();
</script>
