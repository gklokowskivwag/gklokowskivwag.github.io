  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #11181d;
      --card: #1a242b;
      --ink: #e6ecef;
      --muted: #94a3ad;
      --line: #2f3d47;

    }

    color-scheme: dark;

    --card: #1a242b;
    --ink: #e6ecef;

  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 72rem;
    margin: 0 auto;
    padding: 1rem;
  }
  .card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-radius: 6px;
    border-top: 8px solid var(--accent);
    overflow: hidden;
    cursor: pointer;
    user-select: none;

  .progress { height: 4px; background: var(--line); }
  .progress span { display: block; height: 100%; background: var(--accent); width: 0; }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1rem 1.5rem 0;
    color: var(--muted);
    font-size: 1rem;
  }
  .speaker { color: var(--accent); font-weight: 700; font-size: 1.75rem; }
  .slide-cue {
    margin: 0.75rem 1.5rem 0;
    padding: 0.4rem 0.75rem;
    border-left: 4px solid var(--accent);
    background: var(--bg);
    font-weight: 700;
    font-size: 1.125rem;
  }
  h1 {
    margin: 0.5rem 1.5rem 0;
    color: var(--muted);
    font-size: calc(var(--size) * 0.6);
    line-height: 1.2;
    font-weight: 700;
  }
  .text {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.5rem 1.5rem;
    font-size: var(--size);
    line-height: 1.35;
  }
  .text p {
    margin: 0;
    max-width: 34em;
    border-left: 6px solid var(--accent);
    padding-left: 0.75rem;
  }
  .next {
    border-top: 1px solid var(--line);
    padding: 0.75rem 1.5rem;
    color: var(--muted);
    font-size: 1.125rem;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    padding-top: 0.75rem;
  }
  button, select {
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.6rem 1rem;
    cursor: pointer;
  }
  select { max-width: 16rem; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }
  .spacer { flex: 1; }
  .primary { background: var(--accent); color: var(--card); border-color: var(--accent); font-weight: 700; }
  .help { color: var(--muted); font-size: 0.875rem; padding-top: 0.5rem; text-align: center; margin: 0; }
  [hidden] { display: none !important; }
  @media (max-width: 600px) {
    body { --size: 28px; }
    .app { padding: 0.5rem; }
    .speaker { font-size: 1.375rem; }
    .help { display: none; }
  }
</style>
</head>
<body>
<main class="app">
  <article class="card" id="card" aria-live="polite">
    <div class="progress"><span id="bar"></span></div>
    <div class="meta">
      <span class="speaker" id="speaker"></span>
      <span id="position"></span>
    </div>
    <p class="slide-cue" id="slideCue" hidden></p>
    <h1 id="title"></h1>
    <div class="text" id="text"></div>
    <div class="next" id="next"></div>
  </article>
  <div class="controls">
    <button id="prev" type="button">Zurück</button>
    <select id="jump" aria-label="Zu einer Folie springen"></select>
    <button id="smaller" type="button" aria-label="Schrift kleiner">A−</button>
    <button id="bigger" type="button" aria-label="Schrift größer">A+</button>
    <button id="fullscreen" type="button" hidden>Vollbild</button>
    <span class="spacer"></span>
    <button id="nextBtn" class="primary" type="button">Weiter</button>
  </div>
  <p class="help">Weiter mit Enter, Leertaste, Pfeil rechts, Presenter oder Klick auf die Karte. Zurück mit Pfeil links, Backspace oder Klick auf das linke Drittel der Karte. F schaltet Vollbild, + und − ändern die Schrift.</p>
</main>

const names = { G: "Geronimo", A: "Angelo" };
const colors = { G: "var(--geronimo)", A: "var(--angelo)" };
const el = (id) => document.getElementById(id);

function load(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

const steps = cards.flatMap((card) =>
  card.lines.map((line, lineIndex) => ({ card, line, lineIndex }))
);
const firstStepOfSlide = new Map();
steps.forEach((step, i) => {
  if (!firstStepOfSlide.has(step.card.slide)) firstStepOfSlide.set(step.card.slide, i);
});

let index = Math.min(Math.max(Number(load("step2", 0)) || 0, 0), steps.length - 1);
let size = load("textSize", window.innerWidth <= 600 ? 28 : 40);

for (const card of cards) {
  const option = document.createElement("option");
  option.value = String(card.slide);
  option.textContent = `Folie ${card.slide}: ${card.title}`;
  el("jump").append(option);
}

function render() {
  const { card, line, lineIndex } = steps[index];
  const [who, text] = line;
  document.documentElement.style.setProperty("--accent", colors[who]);
  el("speaker").textContent = names[who];
  el("position").textContent = `Folie ${card.slide} von ${cards.length}`;
  el("bar").style.width = `${((index + 1) / steps.length) * 100}%`;

  const newSlide = lineIndex === 0 && index > 0;
  el("slideCue").hidden = !newSlide;
  el("slideCue").textContent = newSlide ? `Neue Folie: jetzt Folie ${card.slide} zeigen` : "";

  el("title").textContent = card.title;
  const p = document.createElement("p");
  p.textContent = text;
  el("text").replaceChildren(p);
  el("text").scrollTop = 0;

  const following = steps[index + 1];
  if (!following) {
    el("next").textContent = "Ende der Präsentation";
  } else if (following.card === card) {
    el("next").textContent = `Danach spricht ${names[following.line[0]]}`;
  } else {
    el("next").textContent = `Danach: Folie ${following.card.slide} zeigen, ${names[following.line[0]]} spricht`;
  }

  el("jump").value = String(card.slide);
  el("prev").disabled = index === 0;
  el("nextBtn").disabled = index === steps.length - 1;
  save("step2", index);
}

function goTo(target) {
  if (target < 0 || target >= steps.length || target === index) return;
  index = target;
  render();
}

function setSize(value) {
  size = Math.min(Math.max(value, 16), 80);
  document.body.style.setProperty("--size", size + "px");
  save("textSize", size);
}

const canFullscreen = Boolean(document.fullscreenEnabled && document.documentElement.requestFullscreen);
el("fullscreen").hidden = !canFullscreen;
function toggleFullscreen() {
  if (!canFullscreen) return;
  const request = document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen();
  request.catch(() => {});
}

let wakeLock = null;
async function keepScreenOn() {
  if (!("wakeLock" in navigator) || wakeLock || document.visibilityState !== "visible") return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch {}
}
document.addEventListener("visibilitychange", keepScreenOn);

document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.target.tagName === "SELECT") return;
  keepScreenOn();
  switch (event.key) {
    case "Enter": case " ": case "ArrowRight": case "ArrowDown": case "PageDown":
      event.preventDefault(); goTo(index + 1); break;
    case "ArrowLeft": case "ArrowUp": case "Backspace": case "PageUp":
      event.preventDefault(); goTo(index - 1); break;
    case "Home":
      event.preventDefault(); goTo(0); break;
    case "End":
      event.preventDefault(); goTo(steps.length - 1); break;
    case "f": case "F":
      toggleFullscreen(); break;
    case "+": case "=":
      setSize(size + 2); break;
    case "-":
      setSize(size - 2); break;
  }
});

el("card").addEventListener("click", (event) => {
  keepScreenOn();
  const box = el("card").getBoundingClientRect();
  goTo(event.clientX - box.left < box.width / 3 ? index - 1 : index + 1);
});

function onClick(id, action) {
  el(id).addEventListener("click", (event) => {
    keepScreenOn();
    action();
    event.currentTarget.blur();
  });
}
onClick("prev", () => goTo(index - 1));
onClick("nextBtn", () => goTo(index + 1));
onClick("bigger", () => setSize(size + 2));
onClick("smaller", () => setSize(size - 2));
onClick("fullscreen", toggleFullscreen);

el("jump").addEventListener("change", (event) => {
  goTo(firstStepOfSlide.get(Number(event.target.value)));
  event.target.blur();
});

setSize(size);
render();
keepScreenOn();
</script>
